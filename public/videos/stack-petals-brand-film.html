function cover(media,x,y,w,h){const iw=media.videoWidth||media.width,ih=media.videoHeight||media.height;if(!iw)return;const r=Math.max(w/iw,h/ih),sw=w/r,sh=h/r;ctx.drawImage(media,(iw-sw)/2,(ih-sh)/2,sw,sh,x,y,w,h)}

function memoryCard(media,x,y,w,h,rot,t){group(x,y,lerp(.92,1,ease(t)),rot,()=>{ctx.shadowColor='#423e3624';ctx.shadowBlur=38;ctx.shadowOffsetY=16;rounded(-w/2,-h/2,w,h,10,'#fffdf9');ctx.shadowColor='transparent';ctx.save();ctx.beginPath();ctx.rect(-w/2+20,-h/2+20,w-40,h-110);ctx.clip();cover(media,-w/2+20,-h/2+20,w-40,h-110);ctx.restore();text('Keep this feeling.',0,h/2-36,34,C.green,'center',true)});}

function scene(n,t,total){
 if(n===0){const p=ease((t-1.9)/1.2);codeStem(ease(t/2),t);ctx.save();ctx.globalAlpha=1-ease((t-1.3)/.6);label('const gift = createSomethingMeaningful();',540,710,28);label('gift.add( care, craft, connection );',540,770,26,C.pink);text('What if code',540,1050,100);text('could bloom?',540,1150,112,C.pink,'center',true);ctx.restore();ctx.save();ctx.globalAlpha=p;group(540,940,lerp(.76,1,p),-.035*(1-p),()=>image(assets.logo,-335,-450,670,820));text('Where code',540,1470,95);text('meets blooms.',540,1570,110,C.pink,'center',true);ctx.restore();particles(t,2,true);}
 if(n===1){caption('01 / CRAFTED BY HAND',['Not just flowers.','A feeling.'],t);shadow(540,1570,300);group(540,1020,1+Math.sin(t*.8)*.018,Math.sin(t*.5)*.012,()=>{ctx.save();ctx.beginPath();ctx.roundRect(-440,-440,880,880,260);ctx.clip();const img=assets.bouquet;ctx.drawImage(img,0,0,img.width*.81,img.height*.7,-440,-440,880,1060);ctx.restore()});ribbon(t,1510);label('Every petal. Every ribbon. Every little detail.',540,1680,25);}
 if(n===2){caption('02 / A LITTLE DIGITAL MAGIC',['One scan.','A whole story.'],t);phone(t,()=>{const zoom=1+Math.sin(t)*.025;group(0,-90,zoom,0,()=>image(assets.bouquet,-200,-300,400,550));rounded(-148,-75,296,296,24,null,C.pink);ctx.save();ctx.globalAlpha=.28;ctx.fillStyle=C.pink;ctx.fillRect(-145,-70+((t*110)%280),290,8);ctx.restore();qr(-72,10,144);label(t>2?'Your story is unlocked.':'Scan your QR keepsake.',0,340,23,C.green);if(t>2){ctx.strokeStyle=C.green;ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,278,22,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(-10,278);ctx.lineTo(-2,286);ctx.lineTo(12,269);ctx.stroke()}});label('A keepsake made personal.',540,1710,27);}
 if(n===3){caption('03 / WORDS THAT STAY',['A message.','Just for you.'],t);letterVisual(t,540,1010,1.1);label('Their words. Your little forever.',540,1630,26);}
 if(n===4){caption('04 / MEMORIES, REVISITED',['The moments','worth keeping.'],t);memoryCard(assets.bouquet,400,1010,530,680,-.12+Math.sin(t)*.013,t);memoryCard(vids.memories,670,1160,530,680,.11+Math.sin(t)*.012,t-.2);label('A photo. A memory. A feeling that returns.',540,1670,24);}
 if(n===5){caption('05 / YOUR SOUNDTRACK',['Some feelings','have a melody.'],t);group(540,970,1,0,()=>{ctx.strokeStyle=C.green;ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(-70,30);ctx.lineTo(-70,-180);ctx.lineTo(90,-220);ctx.lineTo(90,-15);ctx.stroke();ctx.fillStyle=C.green;ctx.beginPath();ctx.ellipse(-99,35,40,28,-.4,0,Math.PI*2);ctx.ellipse(60,-10,40,28,-.4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.18;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(0,0,190+i*60+t*15,0,Math.PI*2);ctx.stroke()}});waveform(total,130,1420,820,165);label('Press play. Feel it all over again.',540,1650,27);}

}
function render(t){t=Math.min(DURATION-.001,Math.max(0,t));background(t);let n=cuts.findIndex((v,i)=>t>=v&&t<cuts[i+1]);if(n<0)n=8;const local=t-cuts[n];if(n>0&&local<.45){ctx.save();ctx.globalAlpha=1-ease(local/.45);scene(n-1,cuts[n]-cuts[n-1],t);ctx.restore()}ctx.save();ctx.globalAlpha=n===0?1:ease(local/.45);const s=lerp(1.035,1,ease(local/1.1));ctx.translate(W/2,H/2);ctx.scale(s,s);ctx.translate(-W/2,-H/2);scene(n,local,t);ctx.restore();ctx.strokeStyle=C.line;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(80,1815);ctx.lineTo(1000,1815);ctx.stroke();tracked('A LITTLE GIFT. A LASTING FEELING.',540,1870,17,3);ctx.fillStyle=C.pink;ctx.fillRect(80,1814,920*t/30,3);}
function tone(freq,time,length,volume,type='sine',pan=0){const o=audio.createOscillator(),g=audio.createGain(),p=audio.createStereoPanner();o.type=type;o.frequency.value=freq;p.pan.value=pan;g.gain.setValueAtTime(0,time);g.gain.linearRampToValueAtTime(volume,time+.012);g.gain.exponentialRampToValueAtTime(.0001,time+length);o.connect(g);g.connect(p);p.connect(master);o.start(time);o.stop(time+length+.05)}

 for(let beat=0;beat<60;beat++){const at=now+beat*.5,chord=chords[Math.floor(beat/8)%4];tone(midi(chord[0]-12),at,1.3,.11);tone(midi(chord[beat%4]+12),at,1.15,.12,'sine',Math.sin(beat)*.35);if(beat%2===0)chord.forEach((n,i)=>tone(midi(n),at+i*.03,2.4,.025,'triangle',(i-1.5)*.3));if(beat%4===0){tone(90,at,.11,.12);tone(54,at,.19,.12)}}
 for(const t of cuts.slice(1,-1)){tone(880,now+t,.5,.06,'sine',-.2);tone(1320,now+t+.09,.7,.035,'sine',.2)}
 [65,69,72,77].forEach((n,i)=>tone(midi(n),now+26+i*.2,3.8,.09));master.gain.setValueAtTime(.5,now+28);master.gain.linearRampToValueAtTime(0,now+30);return now;}
async function start(record=false){if(raf)cancelAnimationFrame(raf);if(audio)await audio.close();for(const v of Object.values(vids)){v.currentTime=0;v.loop=true;await v.play()}recording=record;const begin=soundtrack();await audio.resume();const stream=canvas.captureStream(FPS);for(const track of destination.stream.getAudioTracks())stream.addTrack(track);let recorder,chunks=[];

 document.querySelector('#play').disabled=true;window.filmDone=false;
