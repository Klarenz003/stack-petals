<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stack Petals — The Project Showcase</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#192c24;color:#fffaf5;display:grid;place-items:center;font:13px Inter,Arial}main{width:min(460px,100%);padding:16px}canvas{display:block;width:100%;aspect-ratio:9/16;border-radius:14px;box-shadow:0 16px 60px #0005}footer{padding:16px 0;display:flex;align-items:center;justify-content:space-between;gap:15px}button{background:#fffaf5;border:1px solid #e5c9bf;border-radius:999px;color:#355b48;padding:13px 22px;font:600 13px Inter,Arial;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#status{color:#dfc9bf;font-size:12px}iframe{display:none}</style></head>
<body><main><div id="stage"></div><footer><button id="play" disabled>Preparing showcase…</button><span id="status">60 seconds · Sound on</span></footer></main>
<!-- Reuse the brand film's drawing primitives without duplicating its source. -->
<iframe id="toolkit" src="/videos/stack-petals-brand-film.html" title="Animation toolkit" aria-hidden="true" tabindex="-1"></iframe>
<script type="module">
const frame=document.querySelector('#toolkit');
await new Promise((resolve,reject)=>{let count=0;const timer=setInterval(()=>{if(frame.contentWindow?.filmReady){clearInterval(timer);resolve()}else if(++count>300){clearInterval(timer);reject(Error('Animation toolkit failed to load.'))}},100)});
const tools=frame.contentWindow.brandFilm;
const {ctx,C,rounded,text,label,tracked,image,cover,group,background,particles,ribbon,lineReveal,shadow,waveform,clamp,ease,lerp}=tools.helpers;
const canvas=ctx.canvas;document.querySelector('#stage').append(canvas);
const assets={logo:tools.assets.logo,bouquet:tools.assets.bouquet};
await Promise.all(['home','collection','cart','checkout','composer','letter','chapter-two','about','town'].map(key=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{assets[key]=img;resolve()};img.onerror=()=>reject(Error('Missing showcase capture: '+key));img.src='/videos/showcase-assets/'+key+'.png'})));
const videos={};
await Promise.all([['town','/videos/showcase-assets/town-gameplay.mp4'],['memories','/videos/photo_memories.mp4'],['bouquet','/videos/360view.mp4']].map(([key,src])=>new Promise((resolve,reject)=>{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.onloadeddata=()=>{videos[key]=v;resolve()};v.onerror=()=>reject(Error('Missing showcase footage: '+key));v.src=src;v.load()})));
await document.fonts.ready;
const W=1080,H=1920,duration=60,cuts=[0,6,12,18,24,30,36,42,48,55,60];
const chapters=[['THE STACK PETALS EXPERIENCE','More than a gift.','A whole little world.'],['01 / THE STOREFRONT','Made by hand.','Found with love.'],['02 / CHOOSE YOUR GIFT','For every feeling.','For someone special.'],['03 / MAKE IT PERSONAL','Your gift.','Your words.'],['04 / OPEN THE EXPERIENCE','One little scan.','Something unforgettable.'],['05 / LITTLE THINGS, BIG FEELINGS','Six little reasons.','So many memories.'],['06 / EVERY ANGLE, EVERY FEELING','A chosen melody.','A closer look.'],['07 / STACK PETALS TOWN','A little world.','A lot of heart.'],['08 / PLAY, CREATE, CONNECT','Carry a little joy.','Make a little magic.'],['WHERE CODE MEETS BLOOMS','A little gift.','A lasting feeling.']];
let audio,master,destination,raf=0;
function heading(n,t){const [eyebrow,a,b]=chapters[n];tracked(eyebrow,540,245,19,3);lineReveal(a,540,353,t,87);ctx.save();ctx.globalAlpha=ease(t-.15);text(b,540,445+20*(1-ease(t-.15)),91,C.pink,'center',true);ctx.restore()}
function pill(s,x,y,w=280){rounded(x-w/2,y-25,w,50,25,'#fffaf5',C.line);label(s,x,y+6,18,C.green)}
function screen(img,t,{x=540,y=1075,w=680,h=1250,angle=0,pan=0}={}){const p=ease(t/1.1);group(x+(1-p)*60,y+(1-p)*75,lerp(.94,1,p),angle,()=>{ctx.shadowColor='#304b3924';ctx.shadowBlur=45;ctx.shadowOffsetY=20;rounded(-w/2-12,-h/2-12,w+24,h+24,36,'#fffdf9',C.line);ctx.shadowColor='transparent';ctx.save();ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,25);ctx.clip();const iw=img.width,ih=img.height,r=w/iw,dh=ih*r;const offset=Math.max(0,dh-h)*pan;ctx.drawImage(img,-w/2,-h/2-offset,w,dh);ctx.restore()})}
function cursor(x,y,t){ctx.save();ctx.globalAlpha=clamp(t);ctx.fillStyle=C.green;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+10,y+43);ctx.lineTo(x+21,y+29);ctx.lineTo(x+41,y+28);ctx.closePath();ctx.fill();ctx.strokeStyle=C.cream;ctx.lineWidth=3;ctx.stroke();ctx.restore()}
function mediaCard(v,x,y,w,h,t,rot=0){group(x,y,lerp(.91,1,ease(t)),rot,()=>{ctx.shadowColor='#304b3926';ctx.shadowBlur=35;ctx.shadowOffsetY=20;rounded(-w/2-12,-h/2-12,w+24,h+24,30,'#fffdf9',C.line);ctx.shadowColor='transparent';ctx.save();ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,22);ctx.clip();cover(v,-w/2,-h/2,w,h);ctx.restore()})}
function codeCard(t){group(540,1160,1,Math.sin(t*.3)*.015,()=>{rounded(-440,-220,880,440,28,'#254637');ctx.fillStyle=C.pink;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(-390+i*28,-170,7,0,Math.PI*2);ctx.fill()}label('a-little-gift.ts',0,-160,21,'#e9dbce');ctx.textAlign='left';ctx.font='25px monospace';for(const [i,s] of ['const gift = {','  flowers: "handcrafted",','  story: "made for you",','  memories: "worth keeping",','  feeling: "lasting"','};'].entries()){ctx.fillStyle=i%2?'#e7b6bf':'#d5e5cf';ctx.fillText(s,-365,-95+i*47)}})}
function scene(n,t,total){heading(n,t);
 if(n===0){const p=ease(t/2);group(540,835,lerp(.8,1,p),-.09*(1-p),()=>image(assets.logo,-270,-300,540,600));codeCard(t);ribbon(t,1530);label('Handcrafted flowers. Digital keepsakes. Playful worlds.',540,1660,24);}
 if(n===1){screen(assets.home,t,{y:1050,w:680,h:1140,pan:.25*clamp(t/6)});pill('A real website. A personal touch.',540,1730,500);}
 if(n===2){const transition=ease((t-2.8)/1);screen(assets.collection,t,{x:lerp(540,320,transition),y:1070,w:650,h:1200,angle:-.035*transition});if(transition>0){ctx.save();ctx.globalAlpha=transition;screen(assets.cart,t-2.8,{x:700,y:1180,w:550,h:970,angle:.055});ctx.restore()}cursor(750,1400,ease(t-.7));label('Explore the collection. Build your gift bag.',540,1735,25);}
 if(n===3){const swap=ease((t-2.4)/.8);ctx.save();ctx.globalAlpha=1-swap;screen(assets.checkout,t,{w:680,h:1200});ctx.restore();ctx.save();ctx.globalAlpha=swap;screen(assets.composer,t-2.4,{w:700,h:1200,pan:.35*clamp((t-3.2)/2)});ctx.restore();label('Choose a theme. Add a letter. Select your bouquet.',540,1730,23);}
 if(n===4){screen(assets.letter,t,{w:680,h:1190,pan:0});ribbon(total,1620);pill('Letters that feel like a moment.',540,1740,490);}
 if(n===5){ctx.save();ctx.globalAlpha=1-ease((t-2.5)/1);screen(assets['chapter-two'],t,{w:700,h:1200});ctx.restore();const p=ease((t-2.5)/1);if(p){ctx.save();ctx.globalAlpha=p;mediaCard(videos.memories,540,1100,720,1050,t-2.5,-.04);pill('Little memories, beautifully kept.',540,1710,510);ctx.restore()}}
 if(n===6){mediaCard(videos.bouquet,540,1040,780,920,t,Math.sin(t*.5)*.02);waveform(total,150,1580,780,95);pill('Music + 360° bouquet view',540,1740,470);}
 if(n===7){mediaCard(videos.town,540,990,940,630,t);tracked('LIVE GAMEPLAY CAPTURE',540,1390,18,3);pill('Milo + Luna',310,1520,300);pill('Cat + dog companions',760,1520,390);label('Walk. Run. Explore. Leave a little kindness.',540,1720,25);}
 if(n===8){mediaCard(videos.town,540,900,940,630,t);screen(assets.town,t-.2,{x:540,y:1480,w:840,h:375,pan:.9});pill('Flowers',220,1720,230);pill('Laptop',540,1720,230);pill('Letters',860,1720,230);}
 if(n===9){group(540,920,lerp(.92,1,ease(t/2)),Math.sin(t*.35)*.012,()=>image(assets.logo,-315,-400,630,800));text('Stack Petals',540,1420,130,C.green);tracked('WHERE CODE MEETS BLOOMS',540,1515,22,4);pill('Handcrafted. Personal. Playful.',540,1670,570);particles(total,1.5,true);}
}
function render(total){total=Math.max(0,Math.min(duration-.001,total));background(total);const n=cuts.findIndex((v,i)=>total>=v&&total<cuts[i+1]);const t=total-cuts[n];if(n>0&&t<.35){ctx.save();ctx.globalAlpha=1-ease(t/.35);scene(n-1,cuts[n]-cuts[n-1],total);ctx.restore()}ctx.save();ctx.globalAlpha=n?ease(t/.35):1;const s=lerp(1.04,1,ease(t/1.2));ctx.translate(540,960);ctx.scale(s,s);ctx.translate(-540,-960);scene(n,t,total);ctx.restore();ctx.strokeStyle=C.line;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(80,1825);ctx.lineTo(1000,1825);ctx.stroke();ctx.fillStyle=C.pink;ctx.fillRect(80,1824,920*total/duration,3);tracked('THE PROJECT SHOWCASE',540,1880,18,4);}
function note(midi,at,length,volume,type='sine',pan=0){const o=audio.createOscillator(),g=audio.createGain(),p=audio.createStereoPanner();o.type=type;o.frequency.value=440*2**((midi-69)/12);p.pan.value=pan;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(volume,at+.01);g.gain.exponentialRampToValueAtTime(.0001,at+length);o.connect(g);g.connect(p);p.connect(master);o.start(at);o.stop(at+length+.02)}
function music(){audio=new AudioContext({sampleRate:48000});destination=audio.createMediaStreamDestination();master=audio.createGain();master.gain.value=.45;master.connect(destination);master.connect(audio.destination);const at=audio.currentTime+.1,chords=[[53,57,60,65],[50,57,60,65],[58,62,65,69],[48,55,60,64]],melody=[77,76,72,69,72,74,72,69,65,69,72,74,77,74,72,69];
 for(let beat=0;beat<120;beat++){const time=at+beat*.5,chord=chords[Math.floor(beat/8)%4],soft=beat<12||beat>108?.7:1;note(chord[0]-12,time,1.6,.1*soft);note(chord[beat%4]+12,time,1.5,.09*soft,'sine',Math.sin(beat)*.35);if(beat%2===0){chord.forEach((n,i)=>note(n,time+i*.02,2.6,.025*soft,'triangle',(i-1.5)*.3));note(melody[beat/2%16],time+.02,1.9,.08*soft,'sine',.2)}if(beat>12&&beat<108&&beat%2===0){note(33,time,.1,.11);note(42,time+.04,.08,.02,'triangle')}}
 for(const t of cuts.slice(1,-1)){note(81,at+t,.4,.045);note(88,at+t+.08,.5,.025)}[65,69,72,77].forEach((n,i)=>note(n,at+55+i*.18,4,.08));master.gain.setValueAtTime(.45,at+58);master.gain.linearRampToValueAtTime(0,at+60);return at;}
async function start(record=false){if(raf)cancelAnimationFrame(raf);if(audio)await audio.close();for(const v of Object.values(videos)){v.currentTime=0;v.loop=true;await v.play()}const begin=music();await audio.resume();let rec,chunks=[];const stream=canvas.captureStream(30);for(const track of destination.stream.getAudioTracks())stream.addTrack(track);if(record){rec=new MediaRecorder(stream,{mimeType:'video/mp4;codecs=avc1.42001f,mp4a.40.2',videoBitsPerSecond:11000000,audioBitsPerSecond:192000});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.start(1000)}document.querySelector('#play').disabled=true;
 return new Promise((resolve,reject)=>{if(rec)rec.onerror=e=>reject(e.error);function tick(){const t=Math.max(0,audio.currentTime-begin);render(t);document.querySelector('#status').textContent=Math.min(60,t).toFixed(1)+' / 60 seconds';if(t<60){raf=requestAnimationFrame(tick)}else{raf=0;for(const v of Object.values(videos))v.pause();document.querySelector('#play').disabled=false;document.querySelector('#play').textContent='Replay showcase';if(rec){rec.onstop=()=>{window.filmBlob=new Blob(chunks,{type:rec.mimeType});resolve({bytes:filmBlob.size,type:filmBlob.type,duration,width:W,height:H,fps:30})};rec.stop()}else resolve({duration});for(const track of stream.getTracks())track.stop()}}tick()});}
window.brandFilm={render,start,duration};window.filmReady=true;render(0);document.querySelector('#play').disabled=false;document.querySelector('#play').textContent='Play with sound';document.querySelector('#play').onclick=()=>start(false);
</script></body></html>
